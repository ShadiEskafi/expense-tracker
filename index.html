<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="تطبيق إدارة المصاريف الشخصية الذكي — واجهة عربية أولاً، محلي أولاً، وبدون اتصال بالإنترنت" />
    <title>مَصاريفي — إدارة المصاريف الشخصية</title>
    <!-- Anti-FOUC Theme Script: Synchronously resolves theme before DOM paint to prevent theme flash -->
    <script>
      (function() {
        try {
          var key = 'expense_tracker_theme';
          var stored = localStorage.getItem(key);
          var theme = stored;
          if (theme !== 'dark' && theme !== 'light') {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0B0F19' : '#0F172A');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
